name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux
          # Windows is cross-compiled from Linux with mingw-w64 rather than
          # built on a Windows runner. The MSVC port had drifted into 28 compile
          # errors while CI kept building it, and nothing here could verify a
          # fix; mingw-w64 is the toolchain the Windows sources are maintained
          # against, needs no vcpkg bootstrap, and is the same one the release
          # job packages. build-static-exe.sh then checks the exe's import table,
          # so a binary that needs a DLL next to it fails the job instead of
          # shipping.
          - name: Windows x86_64 (mingw-w64)
            os: ubuntu-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Static, dependency-free, and the same answer on every platform, so it
      # runs once and fails fast: a module may include itself and anything
      # below it, never anything above. The tree is mid-refactor, so the
      # existing upward includes are recorded in the baseline and only new
      # ones fail here.
      - name: Check module include direction
        if: matrix.platform == 'linux'
        run: python3 tools/check_module_deps.py

      # SDL2, freetype and harfbuzz are the GUI frontend's dependencies, and the
      # header check needs them for a reason beyond building the GUI: font_catalog.h
      # includes ft2build.h, and src/CMakeLists.txt adds freetype's include dirs
      # only when the GUI is enabled. Without these packages the configure step
      # cannot find freetype, so the header check compiles font_catalog.h with no
      # way to reach ft2build.h and fails it as a header that does not stand alone.
      # Installing them also means CI finally compiles src/ui/gui, which nothing
      # here did before: the frontend shipped unbuilt and unchecked.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build pkg-config \
            libvterm-dev libtermkey-dev libuv1-dev libutf8proc-dev \
            libtree-sitter-dev libcurl4-openssl-dev \
            libsdl2-dev libfreetype-dev libharfbuzz-dev

      # makensis compiles the installer on Linux too, so this entry ends the
      # same way the release job does: a setup exe the user can run against the
      # tree the import gate just passed.
      - name: Install Windows cross toolchain
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build mingw-w64 nsis

      - name: Configure Linux build
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DJOT_ENABLE_CCACHE=OFF

      # Every header has to compile as the only include of an empty translation
      # unit, using the flags from the configure step just above. Same ratchet
      # as the module check: the fifteen src/editor/api/ files are class-body
      # fragments rather than headers and stay on the baseline until the Editor
      # stops being assembled from them.
      - name: Check headers stand alone
        if: matrix.platform == 'linux'
        run: python3 tools/check_headers.py

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: cmake --build build --parallel 1

      - name: Test Linux
        if: matrix.platform == 'linux'
        run: ctest --test-dir build --output-on-failure

      # The Windows test suite does not build yet (the test sources use POSIX
      # setenv/unsetenv), so this entry compiles and links the shipped binary and
      # gates its imports; behaviour is covered by the Linux entry.
      - name: Build Windows exe (static, cross-compiled)
        if: matrix.platform == 'windows'
        run: |
          packaging/windows/build-static-exe.sh \
            "${GITHUB_WORKSPACE}" \
            "${GITHUB_WORKSPACE}/build-windows-x86_64" \
            "${GITHUB_WORKSPACE}/dist/jot-windows-x86_64"

      # The installer is part of what ships, so it is built here rather than
      # only in the release job: a script that stops compiling is caught on the
      # pull request that broke it, not on the next tag.
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: |
          packaging/windows/build-installer.sh \
            "${GITHUB_WORKSPACE}/dist/jot-windows-x86_64" \
            "${GITHUB_WORKSPACE}/dist/jot-windows-x86_64-setup.exe" \
            "v0.0.0"
          test -s "${GITHUB_WORKSPACE}/dist/jot-windows-x86_64-setup.exe"
