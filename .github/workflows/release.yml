name: Release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux
            archive: jot-linux-x86_64.tar.gz
          - name: Windows x64
            os: windows-2022
            platform: windows
            archive: jot-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build pkg-config \
            libvterm-dev libtermkey-dev libuv1-dev libutf8proc-dev \
            libtree-sitter-dev

      - name: Set up Python on Windows
        if: matrix.platform == 'windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # utf8proc comes from vcpkg (static). libuv is deliberately NOT
          # installed: the CMakeLists FetchContent fallback builds it from
          # source with the project's own compiler/CRT settings (vcpkg's
          # prebuilt static libuv links a mismatched CRT and drops its
          # ws2_32/dbghelp system dependencies). Everything ends up linked
          # INTO jot.exe, so the zip and installer are self-contained.
          vcpkg install utf8proc:x64-windows-static

      - name: Configure Linux build
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DJOT_ENABLE_CCACHE=OFF

      - name: Configure Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>' `
            -DLIBUV_BUILD_SHARED=OFF `
            -DJOT_TREESITTER=OFF `
            -DBUILD_TESTING=OFF

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: cmake --build build --parallel 1

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Install Linux package
        if: matrix.platform == 'linux'
        run: |
          cmake --install build --prefix stage
          tar -C stage -czf "${{ matrix.archive }}" .

      - name: Install Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage
          Compress-Archive -Path stage\* -DestinationPath "${{ matrix.archive }}"

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "packaging\windows\jot.iss"

      - name: Upload installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: jot-windows-installer
          path: packaging/windows/installer/jot-setup-*.exe
          if-no-files-found: error

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release can outlive its tag (e.g. tag deleted then re-pushed), which
          # makes gh release create fail. Delete any stale release first, keeping
          # the tag so it still points at the commit that triggered this run.
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "jot $GITHUB_REF_NAME" \
            --generate-notes
