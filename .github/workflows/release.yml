name: Release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux
            archive: jot-linux-x86_64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build pkg-config unzip \
            libvterm-dev libtermkey-dev libuv1-dev libutf8proc-dev \
            libtree-sitter-dev

      - name: Vendor clangd payload
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          # Ship clangd inside the package so C/C++ support needs no network and
          # no system package: the installer links this copy into its managed
          # LSP dir (runtime/lua/lsp/managers/payload.lua). The archive keeps
          # its versioned top-level directory and the LLVM license, both of
          # which ship as-is.
          json="$(curl -fsSL https://api.github.com/repos/clangd/clangd/releases/latest)"
          url="$(printf '%s' "$json" \
            | grep -o '"browser_download_url": *"[^"]*clangd-linux[^"]*\.zip"' \
            | head -n1 | sed 's/.*"\(https[^"]*\)".*/\1/')"
          test -n "$url"
          echo "Vendoring $url"
          curl -fsSL -o /tmp/clangd.zip "$url"
          mkdir -p payload/clangd
          unzip -q -o /tmp/clangd.zip -d payload/clangd
          rm -f /tmp/clangd.zip
          find payload/clangd -maxdepth 3 \( -name clangd -o -name 'LICENSE*' \) -print

      - name: Configure Linux build
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DJOT_ENABLE_CCACHE=OFF \
            -DJOT_LSP_PAYLOAD_DIR="${GITHUB_WORKSPACE}/payload"

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: cmake --build build --parallel 1

      - name: Install Linux package
        if: matrix.platform == 'linux'
        run: |
          cmake --install build --prefix stage
          tar -C stage -czf "${{ matrix.archive }}" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release can outlive its tag (e.g. tag deleted then re-pushed), which
          # makes gh release create fail. Delete any stale release first, keeping
          # the tag so it still points at the commit that triggered this run.
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "jot $GITHUB_REF_NAME" \
            --generate-notes
