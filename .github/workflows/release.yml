name: Release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux
            archive: jot-linux-x86_64.tar.gz
            # The same staged tree, packaged for the two Linux install paths
            # that do not want to unpack a tarball by hand: one file to run
            # (AppImage) and one for `pacman -U` (.pkg.tar.zst).
            appimage: jot-linux-x86_64.AppImage
          # Cross-compiled with mingw-w64 on the Linux runner; the same script CI
          # runs, so the exe in the release is the one the import gate passed.
          # The installer is built from that same staged tree, and both it and
          # the zip carry the whole tree (bin/jot.exe + share/jot), so neither
          # needs the user to copy anything into place afterwards.
          - name: Windows x86_64
            os: ubuntu-latest
            platform: windows
            archive: jot-windows-x86_64.zip
            installer: jot-windows-x86_64-setup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          # zstd and bsdtar are what the Arch package is assembled with (its
          # .PKGINFO/.MTREE and its zstd-compressed payload); curl downloads
          # appimagetool for the AppImage.
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build pkg-config unzip curl zstd libarchive-tools \
            libvterm-dev libtermkey-dev libuv1-dev libutf8proc-dev \
            libtree-sitter-dev libcurl4-openssl-dev

      - name: Vendor clangd payload
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          # Ship clangd inside the package so C/C++ support needs no network and
          # no system package: the installer links this copy into its managed
          # LSP dir (runtime/lua/lsp/managers/payload.lua). The archive keeps
          # its versioned top-level directory and the LLVM license, both of
          # which ship as-is.
          json="$(curl -fsSL https://api.github.com/repos/clangd/clangd/releases/latest)"
          url="$(printf '%s' "$json" \
            | grep -o '"browser_download_url": *"[^"]*clangd-linux[^"]*\.zip"' \
            | head -n1 | sed 's/.*"\(https[^"]*\)".*/\1/')"
          test -n "$url"
          echo "Vendoring $url"
          curl -fsSL -o /tmp/clangd.zip "$url"
          mkdir -p payload/clangd
          unzip -q -o /tmp/clangd.zip -d payload/clangd
          rm -f /tmp/clangd.zip
          find payload/clangd -maxdepth 3 \( -name clangd -o -name 'LICENSE*' \) -print

      - name: Configure Linux build
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DJOT_ENABLE_CCACHE=OFF \
            -DJOT_LSP_PAYLOAD_DIR="${GITHUB_WORKSPACE}/payload"

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: cmake --build build --parallel 1

      - name: Install Linux package
        if: matrix.platform == 'linux'
        run: |
          cmake --install build --prefix stage
          tar -C stage -czf "${{ matrix.archive }}" .

      # Both of the next two pack the tree just staged, so all three Linux
      # artifacts hold the same binary and the same share/jot data. Each script
      # verifies its own output (the AppImage is extracted through its own
      # runtime, the package is read back by pacman when it is installed).
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          packaging/linux/build-appimage.sh \
            "${GITHUB_WORKSPACE}/stage" \
            "${GITHUB_WORKSPACE}/${{ matrix.appimage }}" \
            "${GITHUB_REF_NAME}"

      - name: Build Arch package
        if: matrix.platform == 'linux'
        run: |
          packaging/linux/make-arch-package.sh \
            "${GITHUB_WORKSPACE}/stage" \
            "${GITHUB_WORKSPACE}" \
            "${GITHUB_REF_NAME}"

      - name: Install Windows cross toolchain
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build mingw-w64 nsis

      - name: Build Windows exe (static, cross-compiled)
        if: matrix.platform == 'windows'
        run: |
          packaging/windows/build-static-exe.sh \
            "${GITHUB_WORKSPACE}" \
            "${GITHUB_WORKSPACE}/build-windows-x86_64" \
            "${GITHUB_WORKSPACE}/dist/jot-windows-x86_64"

      # The installer wraps the staged tree, so it has to be built before the
      # zip so both artifacts are the same bytes; the version is the tag the
      # release is cut from (v3.2.0 -> 3.2.0).
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: |
          packaging/windows/build-installer.sh \
            "${GITHUB_WORKSPACE}/dist/jot-windows-x86_64" \
            "${GITHUB_WORKSPACE}/jot-windows-x86_64-setup.exe" \
            "${GITHUB_REF_NAME}"
          test -s "${GITHUB_WORKSPACE}/jot-windows-x86_64-setup.exe"

      - name: Package Windows zip
        if: matrix.platform == 'windows'
        run: |
          # The staged tree is already trimmed to what ships (see
          # packaging/windows/build-static-exe.sh): bin/jot.exe, share/jot --
          # the layout the exe resolves its own data directory from, see
          # src/base/exe_path.h -- and share/doc with the license texts. The
          # staged include/ and lib/ hold development files the package does not
          # need, and the build gate left no DLL of its own for the exe to find.
          cd "${GITHUB_WORKSPACE}/dist/jot-windows-x86_64"
          cmake -E tar cf "${GITHUB_WORKSPACE}/${{ matrix.archive }}" --format=zip bin share

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appimage }}
          path: ${{ matrix.appimage }}
          if-no-files-found: error

      # The file name carries the version, so the artifact is uploaded by glob
      # and the release asset keeps the name the package was built with.
      - name: Upload Arch package
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: jot-arch-package
          path: ${{ github.workspace }}/*.pkg.tar.zst
          if-no-files-found: error

      # Separate from Upload package so the installer is one named asset on the
      # release, next to the zip it was built from. Guarded on the matrix entry
      # having an installer, so the Linux entry skips it without needing a
      # placeholder name.
      - name: Upload Windows installer
        if: matrix.installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.installer }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release can outlive its tag (e.g. tag deleted then re-pushed), which
          # makes gh release create fail. Delete any stale release first, keeping
          # the tag so it still points at the commit that triggered this run.
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "jot $GITHUB_REF_NAME" \
            --generate-notes
